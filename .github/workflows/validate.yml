name: validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install validators
        run: |
          python -m pip install --disable-pip-version-check cfn-lint ruff
          sudo apt-get update
          sudo apt-get install -y shellcheck
      - name: Validate repository
        run: make validate
